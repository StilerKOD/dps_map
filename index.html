<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ДПС Уссурийск</title>
    <!-- Подключаем Telegram Web Apps API -->
    <script src="https://telegram.org"></script>
    
    <!-- Подключаем Leaflet (Карты) -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    
    <!-- Подключаем Supabase для меток -->
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { margin: 0; padding: 0; height: 100%; background-color: #121212; color: #fff; overflow: hidden; }
        
        #map { width: 100%; height: calc(100% - 70px); background: #121212; }

        /* Нижняя панель */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-top: 1px solid #2d2d2d;
            z-index: 1000;
        }

        .btn-action {
            width: 100%;
            height: 50px;
            background-color: #333333;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-action:active { background-color: #444444; }
        .btn-action.active { background-color: #ff3b30; }
        
        /* Попап в темной теме */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { 
            background: #222222 !important; 
            color: #ffffff !important; 
            border: 1px solid #444; 
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="bottom-bar">
        <button id="action-btn" class="btn-action">Поставить метку на карту</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // Твоя база данных Supabase
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aOP-PtwS2AXySDLBtdILWg_dnXAoqyA";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map;
        let isAddingMode = false;
        const actionBtn = document.getElementById('action-btn');

        // Инициализация карты Leaflet с центром в Уссурийске
        map = L.map('map', { zoomControl: false }).setView([43.7997, 131.9542], 13);

        // ПОДКЛЮЧАЕМ НЕУБИВАЕМЫЙ СЕРВЕР ТЕМНЫХ КАРТ (Работает везде и с любым VPN!)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap & CartoDB'
        }).addTo(map);

        // Принудительно заставляем карту правильно рассчитать размеры экрана в Telegram
        setTimeout(() => { map.invalidateSize(); }, 500);

        // Загрузка меток
        async function loadMarkers() {
            const { data, error } = await supabase.from('markers').select('*');
            if (error) return;

            // Очищаем старые метки перед обновлением
            map.eachLayer((layer) => {
                if (layer instanceof L.Marker) map.removeLayer(layer);
            });

            // Ставим новые
            data.forEach(item => {
                L.marker([item.lat, item.lng])
                    .addTo(map)
                    .bindPopup(`<b>Пост ДПС</b><br>${item.comment || "Без комментария"}`);
            });
        }

        // Клик по карте для добавления метки
        map.on('click', async (e) => {
            if (!isAddingMode) return;

            const { lat, lng } = e.latlng;
            const comment = prompt("Добавьте комментарий к посту ДПС (например: 'Стоят на Владивостокском шоссе'):");
            
            if (comment !== null) {
                const { error } = await supabase.from('markers').insert([{ lat, lng, comment }]);
                if (!error) {
                    L.marker([lat, lng]).addTo(map).bindPopup(`<b>Пост ДПС</b><br>${comment || "Без комментария"}`).openPopup();
                } else {
                    alert('Ошибка сохранения в базу данных');
                }
            }
            resetMode();
        });

        // Кнопка внизу экрана
        actionBtn.addEventListener('click', () => {
            if (!isAddingMode) {
                isAddingMode = true;
                actionBtn.textContent = 'Кликните на карту в месте ДПС...';
                actionBtn.classList.add('active');
            } else {
                resetMode();
            }
        });

        function resetMode() {
            isAddingMode = false;
            actionBtn.textContent = 'Поставить метку на карту';
            actionBtn.classList.remove('active');
        }

        loadMarkers();
        // Обновление меток каждые 20 секунд
        setInterval(loadMarkers, 20000);
    </script>
</body>
</html>
