<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар ДПС Уссурийск</title>
    <script src="https://telegram.org"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { margin: 0; padding: 0; height: 100%; background-color: #0b0f19; color: #fff; overflow: hidden; }
        
        /* Интерактивное поле радара */
        #radar-screen { 
            width: 100%; 
            height: calc(100% - 70px); 
            position: relative; 
            overflow: auto;
            background: radial-gradient(circle, #111827 20%, #0b0f19 80%);
        }

        /* Сетка Уссурийска */
        #ussur-grid {
            width: 1200px;
            height: 1200px;
            position: relative;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
        }

        /* Центр города / Главный перекресток */
        .radar-center {
            position: absolute;
            left: 600px; top: 600px;
            width: 600px; height: 600px;
            border: 1px solid rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Подписи районов для ориентира */
        .district-label { position: absolute; color: rgba(16, 185, 129, 0.4); font-size: 12px; font-weight: bold; pointer-events: none; }

        /* Светящаяся метка ДПС */
        .dps-marker {
            position: absolute;
            width: 22px; height: 22px;
            background-color: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #ef4444;
            animation: pulse 1.5s infinite;
            cursor: pointer;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Нижняя панель */
        .bottom-bar { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; 
            background-color: #111827; display: flex; align-items: center; 
            justify-content: center; padding: 10px; border-top: 1px solid #1f2937; z-index: 1000; 
        }
        .btn-action { 
            width: 100%; height: 50px; background-color: #1f2937; color: #10b981; 
            border: 1px solid #10b981; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        .btn-action.active { background-color: #ef4444; color: #fff; border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

    <div id="radar-screen">
        <div id="ussur-grid">
            <div class="radar-center" style="width:300px; height:300px;"></div>
            <div class="radar-center" style="width:600px; height:600px;"></div>
            <div class="radar-center" style="width:900px; height:900px;"></div>
            
            <!-- Текстовые ориентиры Уссурийска -->
            <div class="district-label" style="left:560px; top:585px;">ЦЕНТР (Некрасова)</div>
            <div class="district-label" style="left:560px; top:350px;">СЕВЕРНЫЙ ГОРОДОК</div>
            <div class="district-label" style="left:560px; top:850px;">ЖД ВОКЗАЛ</div>
            <div class="district-label" style="left:250px; top:585px;">СЛОБОДА</div>
            <div class="district-label" style="left:850px; top:585px;">МЕЖДУРЕЧЬЕ</div>
        </div>
    </div>
    
    <div class="bottom-bar">
        <button id="action-btn" class="btn-action">Поставить метку ДПС</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        if (tg) { tg.expand(); tg.ready(); }

        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aOP-PtwS2AXySDLBtdILWg_dnXAoqyA";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const grid = document.getElementById('ussur-grid');
        const actionBtn = document.getElementById('action-btn');
        let isAddingMode = false;

        // Центрируем экран на "Центр" при старте
        document.getElementById('radar-screen').scrollLeft = 400;
        document.getElementById('radar-screen').scrollTop = 400;

        async function loadMarkers() {
            const { data, error } = await supabase.from('markers').select('*');
            if (error) return;
            document.querySelectorAll('.dps-marker').forEach(m => m.remove());
            data.forEach(item => { drawMarker(item.lat, item.lng, item.comment); });
        }

        function drawMarker(x, y, comment) {
            const marker = document.createElement('div');
            marker.className = 'dps-marker';
            marker.style.left = x + 'px';
            marker.style.top = y + 'px';
            marker.addEventListener('click', (e) => {
                e.stopPropagation();
                alert("🚨 ПОСТ ДПС:\n\n" + (comment || "Без комментария"));
            });
            grid.appendChild(marker);
        }

        actionBtn.addEventListener('click', () => {
            if (!isAddingMode) {
                isAddingMode = true;
                actionBtn.textContent = 'Кликни на сетку радара...';
                actionBtn.classList.add('active');
            } else { resetMode(); }
        });

        function resetMode() {
            isAddingMode = false;
            actionBtn.textContent = 'Поставить метку ДПС';
            actionBtn.classList.remove('active');
        }

        grid.addEventListener('click', async (e) => {
            if (!isAddingMode) return;
            const rect = grid.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const comment = prompt("Укажите улицу / ориентир (например: 'Около заправки на Некрасова'):");
            if (comment !== null) {
                const { error } = await supabase.from('markers').insert([{ lat: x, lng: y, comment: comment }]);
                if (!error) { drawMarker(x, y, comment); }
            }
            resetMode();
        });

        loadMarkers();
        setInterval(loadMarkers, 15000);
    </script>
</body>
</html>
