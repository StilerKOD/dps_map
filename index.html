<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ДПС Уссурийск</title>
    <script src="https://telegram.org"></script>
    
    <!-- Подключаем Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { margin: 0; padding: 0; height: 100%; background-color: #121212; color: #fff; overflow: hidden; }
        #map { width: 100%; height: calc(100% - 70px); background: #121212; }
        
        /* Жесткий CSS-фильтр, который делает любую светлую карту ночной прямо в телефоне */
        .leaflet-tile { filter: brightness(0.6) invert(100%) contrast(300%) hue-rotate(180deg) saturate(0.3) !important; }
        .leaflet-container { background: #121212 !important; }
        
        .bottom-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background-color: #1e1e1e; display: flex; align-items: center; justify-content: center; padding: 10px; border-top: 1px solid #2d2d2d; z-index: 1000; }
        .btn-action { width: 100%; height: 50px; background-color: #333333; color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-action:active { background-color: #444444; }
        .btn-action.active { background-color: #ff3b30; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #222222 !important; color: #ffffff !important; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="bottom-bar">
        <button id="action-btn" class="btn-action">Поставить метку на карту</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        if (tg) { tg.expand(); tg.ready(); }

        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aOP-PtwS2AXySDLBtdILWg_dnXAoqyA";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Инициализируем карту
        const map = L.map('map', { zoomControl: false }).setView([43.7997, 131.9542], 13);
        
        // Подключаем стандартный и самый стабильный в мире сервер картинок дорог
        L.tileLayer('https://openstreetmap.org{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '✔'
        }).addTo(map);

        let isAddingMode = false;
        const actionBtn = document.getElementById('action-btn');

        async function loadMarkers() {
            const { data, error } = await supabase.from('markers').select('*');
            if (error) return;
            map.eachLayer((layer) => { if (layer instanceof L.Marker) map.removeLayer(layer); });
            data.forEach(item => {
                L.marker([item.lat, item.lng]).addTo(map).bindPopup(`<b>Пост ДПС</b><br>${item.comment || "Без комментария"}`);
            });
        }

        actionBtn.addEventListener('click', () => {
            if (!isAddingMode) {
                isAddingMode = true;
                actionBtn.textContent = 'Кликните на карту...';
                actionBtn.classList.add('active');
            } else {
                resetMode();
            }
        });

        function resetMode() {
            isAddingMode = false;
            actionBtn.textContent = 'Поставить метку на карту';
            actionBtn.classList.remove('active');
        }

        map.on('click', async (e) => {
            if (!isAddingMode) return;
            const { lat, lng } = e.latlng;
            const comment = prompt("Добавьте комментарий к метке:");
            if (comment !== null) {
                const { error } = await supabase.from('markers').insert([{ lat, lng, comment }]);
                if (!error) {
                    L.marker([lat, lng]).addTo(map).bindPopup(`<b>Пост ДПС</b><br>${comment || "Без комментария"}`).openPopup();
                }
            }
            resetMode();
        });

        // Принудительный пинок карты, чтобы не было черных областей при старте
        setTimeout(() => { map.invalidateSize(); }, 500);

        loadMarkers();
        setInterval(loadMarkers, 20000);
    </script>
</body>
</html>
