<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ДПС Уссурийск</title>
    <script src="https://telegram.org"></script>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { margin: 0; padding: 0; height: 100%; background-color: #121212; color: #fff; overflow: hidden; }
        
        /* Контейнер интерактивной карты */
        #map-container { 
            width: 100%; 
            height: calc(100% - 70px); 
            position: relative; 
            overflow: auto; 
            background: #1a1a1a;
        }

        /* Задний фон - реальная карта Уссурийска высокого разрешения */
        #ussur-map {
            width: 1500px; /* Фиксированный размер для зума и прокрутки пальцем */
            height: 1500px;
            background-image: url('https://mapbox.com');
            background-size: cover;
            position: relative;
        }

        /* Кастомная метка ДПС */
        .dps-marker {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #ff3b30;
            border: 3px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.8);
            animation: pulse 1.5s infinite;
            cursor: pointer;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* Нижняя панель */
        .bottom-bar { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; 
            background-color: #1e1e1e; display: flex; align-items: center; 
            justify-content: center; padding: 10px; border-top: 1px solid #2d2d2d; z-index: 1000; 
        }
        .btn-action { 
            width: 100%; height: 50px; background-color: #333333; color: #ffffff; 
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; 
        }
        .btn-action:active { background-color: #444444; }
        .btn-action.active { background-color: #ff3b30; }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="ussur-map"></div>
    </div>
    
    <div class="bottom-bar">
        <button id="action-btn" class="btn-action">Поставить метку на карту</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        if (tg) { tg.expand(); tg.ready(); }

        // Твоя база данных Supabase
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aOP-PtwS2AXySDLBtdILWg_dnXAoqyA";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const mapArea = document.getElementById('ussur-map');
        const actionBtn = document.getElementById('action-btn');
        let isAddingMode = false;

        // Автоматически центрируем экран телефона на середину города при открытии
        document.getElementById('map-container').scrollLeft = 500;
        document.getElementById('map-container').scrollTop = 500;

        // Загрузка меток
        async function loadMarkers() {
            const { data, error } = await supabase.from('markers').select('*');
            if (error) return;

            // Удаляем старые метки перед обновлением
            document.querySelectorAll('.dps-marker').forEach(m => m.remove());

            // Отрисовываем новые метки по сохранённым пиксельным координатам
            data.forEach(item => {
                createMarkerElements(item.lat, item.lng, item.comment);
            });
        }

        function createMarkerElements(x, y, comment) {
            const marker = document.createElement('div');
            marker.className = 'dps-marker';
            marker.style.left = x + 'px';
            marker.style.top = y + 'px';
            
            // Нажатие на метку показывает комментарий
            marker.addEventListener('click', (e) => {
                e.stopPropagation();
                alert("🚨 Пост ДПС Уссурийск:\n\n" + (comment || "Без комментария"));
            });

            mapArea.appendChild(marker);
        }

        // Логика нижней кнопки
        actionBtn.addEventListener('click', () => {
            if (!isAddingMode) {
                isAddingMode = true;
                actionBtn.textContent = 'Ткни в любое место на карте Уссурийска...';
                actionBtn.classList.add('active');
            } else {
                resetMode();
            }
        });

        function resetMode() {
            isAddingMode = false;
            actionBtn.textContent = 'Поставить метку на карту';
            actionBtn.classList.remove('active');
        }

        // Клик по карте для установки метки
        mapArea.addEventListener('click', async (e) => {
            if (!isAddingMode) return;

            // Получаем точные пиксельные координаты клика на карте
            const rect = mapArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const comment = prompt("Добавьте комментарий к посту ДПС (например: 'Около автовокзала прячутся'):");
            
            if (comment !== null) {
                // Пишем координаты в базу данных (для простоты юзаем lat/lng поля под X и Y)
                const { error } = await supabase.from('markers').insert([{ lat: x, lng: y, comment: comment }]);
                
                if (!error) {
                    createMarkerElements(x, y, comment);
                } else {
                    alert('Ошибка сети Supabase');
                }
            }
            resetMode();
        });

        loadMarkers();
        setInterval(loadMarkers, 15000); // Обновление каждые 15 сек
    </script>
</body>
</html>
