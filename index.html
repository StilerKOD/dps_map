<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ДПС Уссурийск</title>
    <!-- Подключаем Telegram Web Apps -->
    <script src="https://telegram.org"></script>
    <!-- Подключаем карты 2ГИС (Летают в РФ и Уссурийске напрямую без VPN) -->
    <script src="https://2gis.ru"></script>
    <!-- Подключаем Supabase -->
    <script src="https://unpkg.com"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { margin: 0; padding: 0; height: 100%; background-color: #121212; color: #fff; overflow: hidden; }
        
        #map { width: 100%; height: calc(100% - 70px); background: #121212; }
        
        /* Фильтр, который делает карту 2ГИС ночной и темной */
        .dg-map { filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%) !important; }

        /* Нижняя панель */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-top: 1px solid #2d2d2d;
            z-index: 1000;
        }

        .btn-action {
            width: 100%;
            height: 50px;
            background-color: #333333;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-action:active { background-color: #444444; }
        .btn-action.active { background-color: #ff3b30; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="bottom-bar">
        <button id="action-btn" class="btn-action">Поставить метку на карту</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // Ваша база данных Supabase
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aOP-PtwS2AXySDLBtdILWg_dnXAoqyA";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let myMap;
        let markersGroup;
        let isAddingMode = false;
        const actionBtn = document.getElementById('action-btn');

        // Запуск 2ГИС карт
        DG.then(function () {
            // Создаем карту с центром в Уссурийске
            myMap = DG.map('map', {
                center: [43.7997, 131.9542],
                zoom: 13,
                zoomControl: false,
                fullscreenControl: false
            });

            markersGroup = DG.featureGroup().addTo(myMap);

            // Загружаем сохраненные метки ДПС
            loadMarkers();

            // Клик по карте для добавления метки
            myMap.on('click', async function (e) {
                if (!isAddingMode) return;

                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                
                const comment = prompt("Добавьте комментарий к посту ДПС (например: 'Стоят возле парка'):");
                
                if (comment !== null) {
                    // Отправляем в Supabase
                    const { error } = await supabase.from('markers').insert([{ lat, lng, comment }]);
                    
                    if (!error) {
                        // Сразу ставим на карту
                        DG.marker([lat, lng]).addTo(markersGroup).bindPopup(`<b>Пост ДПС</b><br>${comment || "Без комментария"}`);
                    } else {
                        alert('Ошибка сохранения');
                    }
                }
                resetMode();
            });
        });

        // Загрузка всех меток из Supabase
        async function loadMarkers() {
            const { data, error } = await supabase.from('markers').select('*');
            if (error || !markersGroup) return;

            // Очищаем старые перед отрисовкой
            markersGroup.clearLayers();

            data.forEach(item => {
                DG.marker([item.lat, item.lng])
                    .addTo(markersGroup)
                    .bindPopup(`<b>Пост ДПС</b><br>${item.comment || "Без комментария"}`);
            });
        }

        // Кнопка внизу экрана
        actionBtn.addEventListener('click', () => {
            if (!isAddingMode) {
                isAddingMode = true;
                actionBtn.textContent = 'Кликните на карту в месте ДПС...';
                actionBtn.classList.add('active');
            } else {
                resetMode();
            }
        });

        function resetMode() {
            isAddingMode = false;
            actionBtn.textContent = 'Поставить метку на карту';
            actionBtn.classList.remove('active');
        }

        // Обновляем метки от других людей каждые 20 секунд
        setInterval(loadMarkers, 20000);
    </script>
</body>
</html>
